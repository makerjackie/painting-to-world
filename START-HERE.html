e capabilities. Install one locale only, retaining the whole painting-to-world folder.", "skillZh": "中文 Skill", "skillEn": "English Skill", "guide": "Installation & usage guide", "promptTitle": "Your next request to the AI", "copy": "Copy prompt", "copied": "Copied", "copyFail": "Select and copy the text below", "prompt": "Use the painting-to-world Skill to turn my uploaded painting into a genuinely walkable 3D website. Analyze composition, recognition anchors, palette and brushwork first. Use the café’s engineering quality as a baseline, but reauthor the scene for this painting. Do not substitute a concept image, panorama or recolored café. Include a guided tour, free exploration, Chinese and English, desktop and mobile controls. Inspect and repair actual browser renders. Deliver offline HTML, complete source, instructions, provenance and QA together in one ZIP.", "cmdNote": "Optional scaffold: run from the extracted package root. This only copies the café baseline; it does not convert the supplied image into geometry.", "docTitle": "03 / Read, edit and present", "docNote": "Every document has Chinese, English and editable Markdown versions.", "docs": ["Usage guide", "Product & launch copy", "Complete prompts", "Source & development", "Provenance & versions", "Current-release QA"], "promoTitle": "04 / Bilingual promotional assets", "promoNote": "Four themes in two languages: eight PNGs and editable HTML. Current-release posters use actual website captures.", "promos": ["Hero poster", "Four-step guide", "Product sheet", "The Scream case study"], "image": "View PNG", "editable": "Editable HTML", "scopeTitle": "What is included?", "scope": "An AI authoring workflow, reusable engineering baseline and finished examples—not a standalone image-to-3D model or an already-hosted upload application. New paintings require image-specific analysis, modeling and iteration. Identical fidelity for arbitrary images in one pass is not guaranteed.", "qaNote": "130 browser checks across the two examples passed; 24 initialization and relocation checks passed. Browser checks used Chromium and emulated mobile viewports, not physical devices, Safari or human audio review. See the QA report for limits.", "archive": "Historical AI concept posters and source-less old captures are archived separately, not presented as current runtime evidence.", "footer": "MakerJackie · Painting to World / 入画 · Extract the entire package before use"}};

$('command').textContent=`node skills/${loc}/painting-to-world/scripts/init.mjs ./my-painting --reference ./my-reference.png

$('worldCards').innerHTML=[['cafe-terrace','cafe'],['the-scream','scream']].map(([p,k])=>`<article class="card"><img src="examples/${p}/qa/scene-clean.jpg" alt="${s[k]}"><div class="inner"><h3>${s[k]}</h3><p>${s[k+'Note']}</p><div class="links"><a class="button ${loc==='zh-CN'?'primary':''}" href="examples/${p}/index.html">${s.openZh}</a><a class="button ${loc==='en'?'primary':''}" href="examples/${p}/index.en.html">${s.openEn}</a></div><div class="links fine"><a href="examples/${p}/README.${loc==='en'?'en':'zh-CN'}.md">${s.source}</a>${k==='cafe'?`<a href="examples/cafe-terrace/archive/index.html">${s.original}</a>`:''}</div></div></article>`).join('');

$('promos').innerHTML=['01-hero','02-guide','03-product','04-case'].map((n,i)=>`<article class="promo"><a href="marketing/${loc}/${n}.png"><img loading="lazy" src="marketing/${loc}/${n}.png" alt="${s.promos[i]}"></a><h3>${s.promos[i]}</h3><div class="links"><a href="marketing/${loc}/${n}.png">${s.image}</a><a href="marketing/${loc}/${n}.html">${s.editable}</a></div></article>`).join('');}
